name: FreeBSD Hybrid V8

on:
  push:
    branches: [ "test/freebsd-hybrid-v8" ]
  workflow_dispatch:

jobs:
  hybrid-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - uses: actions/checkout@v4

      - name: Step 1 - Download & Extract FreeBSD Sysroot
        run: |
          echo "下载 FreeBSD base.txz ..."
          wget -q https://download.freebsd.org/releases/amd64/15.0-RELEASE/base.txz
          
          echo "解压库和头文件..."
          mkdir -p freebsd-sysroot
          tar -xf base.txz -C freebsd-sysroot ./lib/ ./usr/lib/ ./usr/include/ ./libexec/
          
          # 确保 libexecinfo 存在真实的实体文件（防止它是个死链接）
          ln -sf ${{ github.workspace }}/freebsd-sysroot/lib/libexecinfo.so.1 ${{ github.workspace }}/freebsd-sysroot/lib/libexecinfo.so 2>/dev/null || true
          ln -sf ${{ github.workspace }}/freebsd-sysroot/lib/libc++.so.1 ${{ github.workspace }}/freebsd-sysroot/lib/libc++.so 2>/dev/null || true
          
          echo "=== 检查提取出来的库 ==="
          ls -la freebsd-sysroot/lib/ | head -n 15

      - name: Step 2 - Setup Zig and Rust
        run: |
          sudo apt-get update
          wget -q https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
          tar -xf zig-linux-x86_64-0.13.0.tar.xz
          echo "${{ github.workspace }}/zig-linux-x86_64-0.13.0" >> $GITHUB_PATH
          
          rustup target add x86_64-unknown-freebsd
          cargo install cargo-zigbuild

      - name: Step 3 - Cross Compile (Absolute Path Injection)
        run: |
          zig version
          
          # 1. 依然把头文件塞进 Zig 的肚子里
          ZIG_INCLUDE_DIR="${{ github.workspace }}/zig-linux-x86_64-0.13.0/lib/include"
          cp -a ${{ github.workspace }}/freebsd-sysroot/usr/include/* $ZIG_INCLUDE_DIR/ 2>/dev/null || true
          
          # 2. 清理缓存
          export ZIG_LOCAL_CACHE_DIR="${{ github.workspace }}/.zig-cache-v8"
          export ZIG_GLOBAL_CACHE_DIR="${{ github.workspace }}/.zig-global-cache-v8"
          
          # 3. 核弹级武器：构造 RUSTFLAGS
          SYSROOT_PATH="${{ github.workspace }}/freebsd-sysroot"
          
          # 我们保留 --sysroot 解决 crt1.o 等启动文件的问题
          # 但为了绕开它那恶心的路径拼接，我们直接用绝对路径把 .so 塞给它！
          export RUSTFLAGS="--sysroot=$SYSROOT_PATH -C panic=abort \
          -C link-arg=-L$SYSROOT_PATH/lib \
          -C link-arg=-L$SYSROOT_PATH/usr/lib \
          -C link-arg=$SYSROOT_PATH/lib/libexecinfo.so \
          -C link-arg=$SYSROOT_PATH/lib/libutil.so.9 \
          -C link-arg=$SYSROOT_PATH/lib/libc.so.7 \
          -C link-arg=$SYSROOT_PATH/lib/libthr.so.3 \
          -C link-arg=$SYSROOT_PATH/lib/libc++.so \
          -C link-arg=$SYSROOT_PATH/lib/libcxxrt.so"
          
          export CFLAGS="-I$SYSROOT_PATH/usr/include"
          
          # 4. 只编主程序排雷
          cargo zigbuild --target x86_64-unknown-freebsd --package cadcraft